<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarm Agent Pattern — Live Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <a href="/" class="brand">
          <div class="brand__mark">S5</div>
          <div class="brand__text">
            <p class="brand__eyebrow">Production agent patterns · 5/5</p>
            <p class="brand__title">Swarm</p>
          </div>
        </a>
        <div class="header-actions">
          <span class="status-badge">Deterministic demo</span>
          <a href="https://github.com/vpeetla-ai/swarm-agent-pattern" class="btn-ghost" style="padding:0.4rem 0.75rem;font-size:0.8rem;text-decoration:none">GitHub</a>
        </div>
      </div>
    </header>
    <main class="shell app-main">
      <div class="page-hero">
        <p class="eyebrow">Parallel workers + merge</p>
        <h1>Swarm Agent Pattern</h1>
        <p class="lede">Autonomous parallel researchers merge with conflict resolution and consensus scoring.</p>
      </div>
      <section class="panel">
        <h2>Run demo</h2>
        <div class="inline-actions"><button id="run" type="button">Run parallel research swarm</button></div>
        <div id="answer" class="answer"></div>
        <div id="trace" class="trace-events"></div>
      </section>
    </main>
    <footer class="app-footer">Swarm pattern · <a href="https://github.com/vpeetla-ai/swarm-agent-pattern">vpeetla-ai</a></footer>
    <script>
      const DEMO = {
        answer: "Merged swarm brief: 3 live sources, 2 rate-limited, consensus on risk-off tone.",
        events: [
          { name: "swarm.spawn", payload: { workers: 4, mission: "market_scan" } },
          { name: "worker.complete", payload: { id: "quotes", status: "live" } },
          { name: "worker.complete", payload: { id: "headlines", status: "live" } },
          { name: "worker.complete", payload: { id: "macro", status: "rate_limited" } },
          { name: "merger.consensus", payload: { agreement: 0.86, conflicts: 1 } },
        ],
      };
      const trace = document.getElementById("trace");
      document.getElementById("run").onclick = async () => {
        trace.innerHTML = "";
        document.getElementById("answer").textContent = "";
        for (const e of DEMO.events) {
          const el = document.createElement("div");
          el.className = "event live";
          el.innerHTML = `<strong>${e.name}</strong><pre>${JSON.stringify(e.payload, null, 2)}</pre>`;
          trace.appendChild(el);
          await new Promise((r) => setTimeout(r, 600));
          el.classList.remove("live");
          el.classList.add("done");
        }
        document.getElementById("answer").textContent = DEMO.answer;
      };
    </script>
  </body>
</html>
